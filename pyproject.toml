[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reactiontools"
dynamic = ["version"]
description = "A centralised set of tools for looking at TS and NEB calculations"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

keywords = [
  "chemistry",
  "computational-chemistry",
  "transition-state",
  "nudged-elastic-band",
  "neb",
  "irc",
  "saddle-point",
  "metadynamics",
  "plumed",
  "orca",
  "free-energy",
  "ase",
]

dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",  # reactiontools/tools_fes.py, reactiontools/tools_orca.py
  "ase>=3.23",
  "geodesic-interpolate @ git+https://github.com/LouieSlocombe/geodesic_interpolate.git",
]
# ORCA is needed at runtime by reactiontools.tools_orca but is licensed
# separately and cannot be installed from PyPI; see build_tools/README.md.

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
# Saddle-point searches only: optimise_ts and optimise_irc. Kept out of the
# main dependencies so the NEB workflows install without them.
ts = [
  "sella",
]
dev = [
  "pytest",
  "pytest-cov",
  "sella",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/reactiontools"
Repository = "https://github.com/LouieSlocombe/reactiontools"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "reactiontools.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["reactiontools", "reactiontools.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:ase.*",
]
