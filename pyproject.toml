[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reactiontools"
dynamic = ["version"]
description = "A centralised set of tools for looking at TS and NEB calculations"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
# Everything here is MIT except reactiontools/tools_sella.py, which is derived
# from Sella and stays under the LGPL that covers it; LICENSE says which is
# which, and the full LGPL text travels in LICENSE.LGPL.
license = "MIT AND LGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.LGPL", "LICENSE.GPL"]

authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

keywords = [
  "chemistry",
  "computational-chemistry",
  "transition-state",
  "nudged-elastic-band",
  "neb",
  "irc",
  "saddle-point",
  "metadynamics",
  "plumed",
  "orca",
  "free-energy",
  "ase",
]

dependencies = [
  "ase>=3.25",
  "matplotlib>=3.8.4",
  "mdtraj>=1.10.2",
  "numpy>=2.0",
  "pandas>=2.2.2",
  "scipy>=1.16",
]
# Python runtime dependencies. Sella and geodesic interpolation are bundled.
# PLUMED and ORCA are installed separately for workflows that use them;
# see docs/installation.md.

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
# The test runner and linter CI runs; not needed to use the package.
# Keep the floors in step with .github/requirements-min.txt.
dev = [
  "pytest>=8.0",
  "pytest-cov",
  "ruff>=0.1.0",
]

# Mirrors the Sphinx half of docs/requirements.txt, which is what ReadTheDocs
# installs; keep the two in step.
docs = [
  "sphinx>=8.1",
  "furo",
  "myst-parser>=4.0",
  "sphinx-copybutton",
  "sphinx-design",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/reactiontools"
Documentation = "https://reactiontools.readthedocs.io"
Repository = "https://github.com/LouieSlocombe/reactiontools"
Changelog = "https://github.com/LouieSlocombe/reactiontools/blob/main/CHANGELOG.md"
Issues = "https://github.com/LouieSlocombe/reactiontools/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "reactiontools.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["reactiontools", "reactiontools.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "integration: exercises an optional executable, dependency, or local socket transport",
  "slow: long-running optimisation (deselect with '-m \"not slow\"')",
]
filterwarnings = [
  "ignore::DeprecationWarning:ase.*",
  "ignore:The implementation of `fixcm=True`.*:FutureWarning:ase.md.langevin",
  "ignore:Log flushes by default now.*:FutureWarning:ase.optimize.optimize",
]

[tool.coverage.run]
branch = true
source = ["reactiontools"]
# Bundled upstream OPES command-line programs are smoke-tested as subprocesses;
# they are not maintained as importable reactiontools library modules.
# tools_sella.py is vendored upstream Sella. tests/test_sella.py exercises it,
# but holding 9000 lines of someone else's code to this package's coverage bar
# would only measure how much of Sella these workflows happen to touch.
omit = [
  "reactiontools/opes/FES_from_Reweighting.py",
  "reactiontools/opes/FES_from_State.py",
  "reactiontools/opes/State_from_Kernels.py",
  "reactiontools/tools_sella.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
# Bundled upstream PLUMED scripts, retained with their original style so that
# they stay easy to diff against the project they came from.
extend-exclude = ["reactiontools/opes/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# tools_sella.py is vendored Sella, kept close to the tree it came from so that
# it stays diffable against it -- the fork and commit are named in the header
# of that file. Both of these are upstream findings, not this package's, and
# both are still present at that commit:
#   F841  five dead local assignments.
#   E702  one compound statement written with a semicolon.
# The F821 that used to be ignored here is gone: _rotation_3axis_hvp
# referenced the undefined _rotation_3axis_masked, and it was dead code --
# nothing called it or the jitted wrapper below it, the live path being
# _rotation_3axis_hvp_batched_closed -- so both were deleted rather than
# ignored. The deletion is recorded in the tools_sella.py header.
"reactiontools/tools_sella.py" = ["E702", "F841"]
