[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reactiontools"
version = "0.0.0"
description = "A centralised set of tools for looking at TS and NEB calculations"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.14"
license = { text = "MIT" }

authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

dependencies = [
  "numpy",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/reactiontools"
Repository = "https://github.com/LouieSlocombe/reactiontools"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["reactiontools", "reactiontools.*"]

[tool.setuptools.package-data]
"reactiontools" = ["data/*"]
