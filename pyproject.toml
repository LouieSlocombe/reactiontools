[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reactiontools"
dynamic = ["version"]
description = "A centralised set of tools for looking at TS and NEB calculations"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

keywords = [
  "chemistry",
  "computational-chemistry",
  "transition-state",
  "nudged-elastic-band",
  "neb",
  "irc",
  "saddle-point",
  "metadynamics",
  "plumed",
  "orca",
  "free-energy",
  "ase",
]

dependencies = [
  "ase>=3.25",
  "matplotlib>=3.8.4",
  "mdtraj>=1.10.2",
  "numpy>=2.0",
  "pandas>=2.2.2",
  "scipy>=1.16",
]
# Everything the package needs to import and to run every workflow except the
# saddle-point searches. PyPI rejects any distribution whose metadata carries a
# direct URL requirement, so nothing here may be a git+https dependency -- which
# is why the two that used to be are handled the way they are:
#
# geodesic_interpolate  vendored as reactiontools._geodesic, because the fork
#                       the package needs is not on PyPI and the distribution
#                       that is there lacks its ASE entry point.
# sella                 not declared at all. optimise_ts, optimise_irc and
#                       sella_ts_search import it on demand and explain how to
#                       install it if it is missing; see docs/installation.md.
#
# ORCA is needed at runtime by reactiontools.tools_orca but is licensed
# separately and installed by hand; see build_tools/README.md.

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
# The test runner and linter CI runs; not needed to use the package.
# Keep the floors in step with .github/requirements-min.txt.
dev = [
  "pytest>=8.0",
  "pytest-cov",
  "ruff>=0.1.0",
]

# Mirrors the Sphinx half of docs/requirements.txt, which is what ReadTheDocs
# installs; keep the two in step.
docs = [
  "sphinx>=8.1",
  "furo",
  "myst-parser>=4.0",
  "sphinx-copybutton",
  "sphinx-design",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/reactiontools"
Documentation = "https://reactiontools.readthedocs.io"
Repository = "https://github.com/LouieSlocombe/reactiontools"
Changelog = "https://github.com/LouieSlocombe/reactiontools/blob/main/CHANGELOG.md"
Issues = "https://github.com/LouieSlocombe/reactiontools/issues"

[tool.setuptools]
include-package-data = true

# The vendored geodesic code is MIT; its licence has to travel with every
# distribution, so it ships inside the package rather than only in the sdist.
[tool.setuptools.package-data]
"reactiontools._geodesic" = ["LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "reactiontools.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["reactiontools", "reactiontools.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "integration: exercises an optional executable, dependency, or local socket transport",
]
filterwarnings = [
  "ignore::DeprecationWarning:ase.*",
  "ignore:The implementation of `fixcm=True`.*:FutureWarning:ase.md.langevin",
  "ignore:Log flushes by default now.*:FutureWarning:ase.optimize.optimize",
  "ignore:Error reading persistent compilation cache entry.*:UserWarning:jax._src.compiler",
]

[tool.coverage.run]
branch = true
source = ["reactiontools"]
# Bundled upstream OPES command-line programs are smoke-tested as subprocesses;
# they are not maintained as importable reactiontools library modules.
omit = [
  "reactiontools/opes/FES_from_Reweighting.py",
  "reactiontools/opes/FES_from_State.py",
  "reactiontools/opes/State_from_Kernels.py",
  # Vendored upstream code with its own test suite in the project it came from.
  "reactiontools/_geodesic/*.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
# Vendored upstream code, retained with its original style so that it stays
# easy to diff against the project it came from.
extend-exclude = ["reactiontools/opes/*.py", "reactiontools/_geodesic/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
