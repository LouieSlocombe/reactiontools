[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reactiontools"
dynamic = ["version"]
description = "A centralised set of tools for looking at TS and NEB calculations"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

keywords = [
  "chemistry",
  "computational-chemistry",
  "transition-state",
  "nudged-elastic-band",
  "neb",
  "irc",
  "saddle-point",
  "metadynamics",
  "plumed",
  "orca",
  "free-energy",
  "ase",
]

dependencies = [
  "ase>=3.23",
  "geodesic-interpolate @ git+https://github.com/LouieSlocombe/geodesic_interpolate.git",
  "matplotlib",
  "mdtraj",
  "numpy",
  "pandas",
  "pytest",
  "pytest-cov",
  "ruff",
  "scipy",
  "sella @ git+https://github.com/LouieSlocombe/sella.git",
]
# ORCA is needed at runtime by reactiontools.tools_orca but is licensed
# separately and cannot be installed from PyPI; see build_tools/README.md.

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/reactiontools"
Repository = "https://github.com/LouieSlocombe/reactiontools"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "reactiontools.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["reactiontools", "reactiontools.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "integration: exercises an optional executable, dependency, or local socket transport",
]
filterwarnings = [
  "ignore::DeprecationWarning:ase.*",
  "ignore:The implementation of `fixcm=True`.*:FutureWarning:ase.md.langevin",
  "ignore:Log flushes by default now.*:FutureWarning:ase.optimize.optimize",
  "ignore:Error reading persistent compilation cache entry.*:UserWarning:jax._src.compiler",
]

[tool.coverage.run]
branch = true
source = ["reactiontools"]
# Bundled upstream OPES command-line programs are smoke-tested as subprocesses;
# they are not maintained as importable reactiontools library modules.
omit = [
  "reactiontools/opes/FES_from_Reweighting.py",
  "reactiontools/opes/FES_from_State.py",
  "reactiontools/opes/State_from_Kernels.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
# These are upstream command-line scripts retained with their original style.
extend-exclude = ["reactiontools/opes/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
