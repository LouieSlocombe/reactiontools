name: reactiontools

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python>=3.13
  - numpy>=2.0
  - matplotlib>=3.8.4
  - pandas>=2.2.2
  - ase>=3.25
  - scipy>=1.16
  - mdtraj>=1.10.2
  - pip
  - pytest>=8.0
  - pytest-cov
  - ruff>=0.1.0

  # --- Build tools, for build_plumed.sh ---
  # The installers build PLUMED with the opes module for OPES simulations.
  - make
  - cxx-compiler
  # build_py_plumed regenerates the py-plumed C extension from its .pyx source.
  - cython

# Install the package separately from the repository root:
# python -m pip install -e .
# Sella and geodesic interpolation are included in the package.
