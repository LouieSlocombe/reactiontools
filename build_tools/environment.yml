name: reactiontools

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python>=3.13
  - numpy>=2.0
  - matplotlib>=3.8.4
  - pandas>=2.2.2
  - ase>=3.25
  - scipy>=1.16
  - mdtraj>=1.10.2
  - pip
  - pytest>=8.0
  - pytest-cov
  - ruff>=0.1.0

  # --- Build tools, for build_plumed.sh ---
  # PLUMED is compiled rather than taken from conda-forge because that build has
  # no opes module, which tools_cv's f_opes=True inputs and run_opes_fes need.
  - make
  - cxx-compiler
  # build_py_plumed regenerates the py-plumed C extension from its .pyx source.
  - cython

# sella is deliberately absent, and needs nothing doing about it: the
# saddle-point searches are part of the package now, as
# reactiontools/tools_sella.py, so `pip install -e ..` is all it takes. jax,
# which that module needs, comes in the same way. See docs/installation.md.
