name: reactiontools

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python>=3.13
  - numpy
  - matplotlib
  - pandas
  - ase
  - scipy
  - mdtraj
  - pip
  - pytest
  - pytest-cov
  - ruff

  # --- Build tools, for build_plumed.sh ---
  # PLUMED is compiled rather than taken from conda-forge because that build has
  # no opes module, which tools_cv's f_opes=True inputs and run_opes_fes need.
  - make
  - cxx-compiler
  # build_py_plumed regenerates the py-plumed C extension from its .pyx source.
  - cython

# geodesic_interpolate and sella are deliberately absent: conda_install.sh clones
# them next to this repository and installs them editable (see editable_repos.sh).
# Creating this environment on its own leaves them out, and `pip install -e ..`
# then pulls them from git, as pyproject.toml declares them.
