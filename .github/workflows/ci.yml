name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Only `ruff check`: the project configures lint rules but no formatter
      # settings, so `ruff format --check` would flag the whole codebase.
      - run: pipx run ruff check .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      # The same environment ReadTheDocs builds in: reactiontools is imported
      # from the checkout, and the heavy dependencies are mocked in conf.py.
      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

  tests:
    name: Python ${{ matrix.python-version }}, ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        dependencies: [latest]
        include:
          - python-version: "3.12"
            dependencies: minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/requirements-min.txt
      # Pulls sella and geodesic_interpolate from git, and mdtraj wheels.
      - name: Install current dependencies
        if: matrix.dependencies == 'latest'
        run: pip install -e .
      - name: Install minimum dependencies
        if: matrix.dependencies == 'minimum'
        run: pip install -c .github/requirements-min.txt -e .
      - run: pip check
      - name: Lint with the minimum Ruff version
        if: matrix.dependencies == 'minimum'
        run: ruff check .
      # ORCA tests skip without ORCA_PATH; the `integration` tests skip if the
      # runner will not open local sockets. Coverage enforces the floor set in
      # [tool.coverage.report].
      - run: pytest --cov
